name: CI

# The compiler comes from a pinned published release, not from a source build.
#
# This used to clone M1778/Fin and run ./build.sh, which cost twenty minutes per job and
# needed Conan, CMake, Flex, Bison and LLVM 22 on every runner. Worse, it tested whatever
# the compiler's master happened to be that morning: a red run could not be attributed
# without reading a second repository.
#
# FINC_VERSION pins it, and .github/scripts/install_finc.py verifies the archive's sha256
# against the release index before unpacking it.
#
# EVERY lane compiles AND executes a real program. A type-check is not a test, and a lane
# that only checks has not run the library.
#
# FIN_LDFLAGS is load-bearing and platform-specific. `finc` appends a link line written for
# its own object, which calls the LLVM C API, so the default is `-lLLVM-<major>`. A program
# compiled here references no LLVM symbol (checked with `nm -u`: libc and libm only), and
# requiring it would force every runner to install a matching LLVM. MSVC has no separate
# libm -- the CRT supplies those symbols -- and `-lm` becomes a request for `m.lib`, which
# does not exist, so the Windows job clears the variable to its own default.

on:
  push:
    branches: [master, main, "production/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform's failure must not cancel the other two: the point of the matrix is
      # to find out which platforms are broken.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    env:
      FIN_LDFLAGS: "-lm"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provide the LLVM runtime the darwin compiler links against
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The published darwin finc records an absolute dependency on
          # /opt/homebrew/opt/llvm@22/lib/libLLVM.dylib. The runner ships no
          # Homebrew, and the installer correctly refuses a compiler whose
          # --version dies in dyld, so the runtime has to be there first.
          brew install llvm@22

      - name: Install the pinned finc
        shell: bash
        run: python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"

      - name: Put finc on PATH and choose the platform link line
        shell: bash
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"
          FINC="$RUNNER_TEMP/finc/bin/finc"
          "$FINC" --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            {
              echo "FIN_LDFLAGS<<FINSON_ENV_EOF"
              echo ""
              echo "FINSON_ENV_EOF"
            } >> "$GITHUB_ENV"
          fi
          # finc writes exactly the -o path; it does not append .exe.
          exe=""
          case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) exe=".exe" ;; esac
          echo "FINSON_EXE=$exe" >> "$GITHUB_ENV"

      - name: Type-check the library
        shell: bash
        run: finc finson.fin

      - name: Build and run the tests
        shell: bash
        run: |
          set -euo pipefail
          finc tests/test_lib.fin -o "$RUNNER_TEMP/test_lib$FINSON_EXE"
          "$RUNNER_TEMP/test_lib$FINSON_EXE"

      - name: Build and run the example
        shell: bash
        run: |
          set -euo pipefail
          finc examples/basic.fin -o "$RUNNER_TEMP/example_basic$FINSON_EXE"
          "$RUNNER_TEMP/example_basic$FINSON_EXE"

      - name: Builder diagnostics fire as named (a SIGSEGV fails this)
        shell: bash
        run: python -I tests/probe_failures.py "$RUNNER_TEMP/test_lib$FINSON_EXE"

  # The differential oracle compares parse and stringify against Python's json. It needs a
  # real executable, so it runs where one is cheap and native.
  differential:
    name: differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      FIN_LDFLAGS: "-lm"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provide the LLVM runtime the darwin compiler links against
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The published darwin finc records an absolute dependency on
          # /opt/homebrew/opt/llvm@22/lib/libLLVM.dylib. The runner ships no
          # Homebrew, and the installer correctly refuses a compiler whose
          # --version dies in dyld, so the runtime has to be there first.
          brew install llvm@22

      - name: Install the pinned finc
        shell: bash
        run: python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"

      - name: Put finc on PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"
          FINC="$RUNNER_TEMP/finc/bin/finc"
          "$FINC" --version

      - name: Build
        shell: bash
        run: finc tests/test_lib.fin -o "$RUNNER_TEMP/test_lib"

      - name: Compare parse and stringify against Python's json
        shell: bash
        run: python -I tests/differential.py "$RUNNER_TEMP/test_lib"

  # The ownership contract is a runtime property, so it gets a runtime checker.
  # AddressSanitizer is Linux-only because that is where a prebuilt one is cheap.
  sanitizers:
    name: asan + -O2 (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIN_LDFLAGS: "-lm"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provide the LLVM runtime the darwin compiler links against
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The published darwin finc records an absolute dependency on
          # /opt/homebrew/opt/llvm@22/lib/libLLVM.dylib. The runner ships no
          # Homebrew, and the installer correctly refuses a compiler whose
          # --version dies in dyld, so the runtime has to be there first.
          brew install llvm@22

      - name: Install the pinned finc
        shell: bash
        run: python .github/scripts/install_finc.py --dest "$RUNNER_TEMP/finc"

      - name: Put finc on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/finc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/finc/bin/finc" --version

      - name: Suite, probes and differential under AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          finc -O0 -c tests/test_lib.fin -o "$RUNNER_TEMP/test_finson.o"
          cc -fsanitize=address -g "$RUNNER_TEMP/test_finson.o" -o "$RUNNER_TEMP/test_finson_asan"
          "$RUNNER_TEMP/test_finson_asan"
          python -I tests/probe_failures.py "$RUNNER_TEMP/test_finson_asan"
          python -I tests/differential.py "$RUNNER_TEMP/test_finson_asan"

      - name: Optimized build
        shell: bash
        run: |
          set -euo pipefail
          finc -O2 tests/test_lib.fin -o "$RUNNER_TEMP/test_finson_o2"
          "$RUNNER_TEMP/test_finson_o2"
          python -I tests/differential.py "$RUNNER_TEMP/test_finson_o2"
