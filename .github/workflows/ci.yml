name: CI

on:
  push:
    branches: [master, main, "production/**"]
  pull_request:

jobs:
  # Compile and execute the real test programs. A type-check is not a test:
  # every lane here links and runs tests/test_lib.fin.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-musl
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned finc
        run: python .github/scripts/install_finc.py

      - name: Show compiler
        shell: bash
        run: finc --version

      - name: Build and run the test suite
        shell: bash
        run: |
          set -euo pipefail
          finc tests/test_lib.fin -o test_finson
          ./test_finson

      - name: Build and run the example
        shell: bash
        run: |
          set -euo pipefail
          finc examples/basic.fin -o example_basic
          ./example_basic

      - name: Builder diagnostics fire as named (SIGSEGV would fail this)
        shell: bash
        run: python -I tests/probe_failures.py ./test_finson

  # The differential oracle compares parse/stringify against Python's json.
  # It needs a real executable, so it runs where one is cheap and native.
  differential:
    name: differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned finc
        run: python .github/scripts/install_finc.py

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          finc tests/test_lib.fin -o test_finson

      - name: Compare against Python's json
        shell: bash
        run: |
          set -euo pipefail
          python -I tests/differential.py ./test_finson

  # Leak-checked and optimized lanes: the ownership contract is a runtime
  # property, so AddressSanitizer (Linux) and -O2 (both) are separate proofs.
  sanitizers:
    name: asan + -O2 (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned finc
        run: python .github/scripts/install_finc.py

      - name: Every allocation-owning path under AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          finc -O0 -c tests/test_lib.fin -o test_finson.o
          cc -fsanitize=address -g test_finson.o -o test_finson_asan
          ./test_finson_asan
          python -I tests/probe_failures.py ./test_finson_asan

      - name: Differential suite under AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          python -I tests/differential.py ./test_finson_asan

      - name: Optimized build
        shell: bash
        run: |
          set -euo pipefail
          finc -O2 tests/test_lib.fin -o test_finson_o2
          ./test_finson_o2
          python -I tests/differential.py ./test_finson_o2
