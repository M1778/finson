name: CI

on:
  push:
    branches: [master, main, "production/**"]
  pull_request:

# Every lane compiles AND executes the test program. A type-check is not a test.
#
# The compiler path is passed explicitly through FINC rather than relying on
# `::add-path::`: that workflow command was retired, so a runner silently ignores
# it and the next step finds no `finc`. All steps use bash, including Windows,
# so one spelling of the path works everywhere.
#
# FIN_LDFLAGS is load-bearing and platform-specific. `finc` appends a link line
# meant for the compiler's own object, which calls the LLVM C API, so the default
# is `-lLLVM-<major>`. A program this repository compiles references no LLVM
# symbol (checked with `nm -u`), and requiring the library would force every
# runner to install a matching LLVM, including the macOS keg that default looks
# for. On Linux and macOS only libm is used. MSVC has no separate libm -- the
# CRT supplies it -- and `-lm` becomes a request for `m.lib`, which does not
# exist, so the flag is left empty there.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      # Replaced per job below; MSVC cannot link -lm.
      FIN_LDFLAGS: "-lm"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/install_finc.py
          echo "FINC=$PWD/.finc/bin/finc" >> "$GITHUB_ENV"

      - name: Show compiler and choose the link line
        shell: bash
        run: |
          set -euo pipefail
          "$FINC" --version
          # clang on Windows drives link.exe, which has no separate libm: `-lm`
          # is a request for m.lib, which does not exist. An empty value makes
          # finc fall back to its own Windows default (-lws2_32).
          if [ "$RUNNER_OS" = "Windows" ]; then
            {
              echo "FIN_LDFLAGS<<FINSON_ENV_EOF"
              echo ""
              echo "FINSON_ENV_EOF"
            } >> "$GITHUB_ENV"
          fi
          # finc writes exactly the -o path, so the executable suffix is chosen
          # here rather than guessed by the shell later.
          exe=""
          case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) exe=".exe" ;; esac
          echo "FINSON_EXE=$exe" >> "$GITHUB_ENV"

      - name: Build and run the test suite
        shell: bash
        run: |
          set -euo pipefail
          "$FINC" tests/test_lib.fin -o "test_finson$FINSON_EXE"
          "./test_finson$FINSON_EXE"

      - name: Build and run the example
        shell: bash
        run: |
          set -euo pipefail
          "$FINC" examples/basic.fin -o "example_basic$FINSON_EXE"
          "./example_basic$FINSON_EXE"

      - name: Builder diagnostics fire as named (a SIGSEGV fails this)
        shell: bash
        run: python -I tests/probe_failures.py "./test_finson$FINSON_EXE"

  differential:
    name: differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FIN_LDFLAGS: "-lm"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/install_finc.py
          echo "FINC=$PWD/.finc/bin/finc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: '"$FINC" tests/test_lib.fin -o test_finson'

      - name: Compare parse and stringify against Python's json
        shell: bash
        run: python -I tests/differential.py ./test_finson

  # The ownership contract is a runtime property, so it gets a runtime checker.
  # AddressSanitizer is Linux-only because that is where a prebuilt one is cheap.
  sanitizers:
    name: asan + -O2 (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIN_LDFLAGS: "-lm"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/install_finc.py
          echo "FINC=$PWD/.finc/bin/finc" >> "$GITHUB_ENV"

      - name: Suite, probes and differential under AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          "$FINC" -O0 -c tests/test_lib.fin -o test_finson.o
          cc -fsanitize=address -g test_finson.o -o test_finson_asan
          ./test_finson_asan
          python -I tests/probe_failures.py ./test_finson_asan
          python -I tests/differential.py ./test_finson_asan

      - name: Optimized build
        shell: bash
        run: |
          set -euo pipefail
          "$FINC" -O2 tests/test_lib.fin -o test_finson_o2
          ./test_finson_o2
          python -I tests/differential.py ./test_finson_o2
